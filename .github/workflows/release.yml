name: Release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint
        run: find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l
      - name: No internal links or values (public repo)
        run: bin/scan-internal.sh
      - name: Tests
        run: php tests/run.php
      - name: Build the zip
        run: bin/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tapper-for-woocommerce
          path: dist/*.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="dist/tapper-for-woocommerce-${VERSION}.zip"
          test -f "$ZIP" || { echo "tag $GITHUB_REF_NAME does not match the plugin version" >&2; exit 1; }
          # The same zip under a fixed name, so https://github.com/<repo>/releases/latest/download/tapper-for-woocommerce.zip always works.
          cp "$ZIP" dist/tapper-for-woocommerce.zip
          gh release create "$GITHUB_REF_NAME" "$ZIP" dist/tapper-for-woocommerce.zip --title "Tapper for WooCommerce ${VERSION}" --notes "See readme.txt for the changelog." || gh release upload "$GITHUB_REF_NAME" "$ZIP" dist/tapper-for-woocommerce.zip --clobber
